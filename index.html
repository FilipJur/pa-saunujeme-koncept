<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>saunujeme-koncept</title>
  </head>
  <body>
    <section class="hero-section">
      <div class="hero-video-bg">
        <video
          autoplay
          muted
          loop
          playsinline
          poster="assets/bg-video-thumb.png"
          src="assets/saunujeme-video-hero.mp4"
        ></video>
      </div>

      <div class="circle-nav-container">
        <a
          href="#"
          class="sub-circle sub-circle--light"
          aria-label="Typizované infrasauny"
        >
          <span>TYPIZOVANÉ<br />INFRASAUNY</span>
        </a>
        <a
          href="#"
          class="sub-circle sub-circle--light"
          aria-label="Infrasauny na míru"
        >
          <span>INFRASAUNY<br />NA MÍRU</span>
        </a>
        <a
          href="#"
          class="sub-circle sub-circle--light"
          aria-label="Infrasauny dle počtu osob"
        >
          <span>INFRASAUNY<br />DLE POČTU<br />OSOB</span>
        </a>
        <a
          href="#"
          class="sub-circle sub-circle--light"
          aria-label="Venkovní infrasauny"
        >
          <span>VENKOVNÍ<br />INFRASAUNY</span>
        </a>
        <a
          href="#"
          class="sub-circle sub-circle--light"
          aria-label="Physiotherm"
        >
          <span>PHYSIOTHERM</span>
        </a>

        <div class="main-circle">
          <div class="main-circle-content">
            <h1>Infrasauna</h1>
            <p>
              Dopřejte si chvíle klidu, regenerace a hlubokého prohřátí již za
              jednu sekundu. Naše infrasauny prohřejí vaše tělo až do hloubky 4
              cm.
            </p>
          </div>
        </div>
      </div>
    </section>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
