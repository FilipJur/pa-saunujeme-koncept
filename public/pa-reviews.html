<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Venkovní infrasauny — Dev Preview</title>
    <link rel="stylesheet" href="shared.css" />

    <!-- Swiper -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />

    <!-- Fancybox -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.css"
    />

    <style>
      .pa-reviews {
        max-width: unset;
        padding-inline: 60px;
      }

      .pa-reviews__swiper {
        overflow: hidden;
      }

      .pa-reviews__slide {
        flex-shrink: 0;
        transition: opacity 0.3s ease;
      }

      .pa-reviews__slide--faded {
        opacity: 0.2;
      }

      .pa-reviews__card {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      .pa-reviews__thumb {
        position: relative;
        width: 100%;
        aspect-ratio: 249 / 373;
        background: #d9d9d9;
        overflow: hidden;
      }

      .pa-reviews__video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .pa-reviews__play {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        text-decoration: none;
      }

      .pa-reviews__play-icon {
        width: 40px;
        height: 47px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pa-reviews__info {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 30px 0 10px;
      }

      .pa-reviews__stars {
        display: flex;
        justify-content: flex-start;
        gap: 7px;
      }

      .pa-reviews__star {
        width: 20px;
        height: 19px;
        flex-shrink: 0;
      }

      .pa-reviews__name {
        font-family: var(--pa-font-base);
        font-size: 23px;
        font-weight: 400;
        color: var(--pa-color-dark);
        line-height: 1.2;
        margin: 0;
      }

      .pa-reviews__text {
        font-family: var(--pa-font-base);
        font-size: 16px;
        font-weight: 400;
        color: var(--pa-color-dark);
        line-height: 1.5;
        margin: 0;
      }

      .pa-reviews__nav {
        position: absolute;
        bottom: -6px;
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: #000000;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        transition: opacity 0.2s ease;
        padding: 0;
      }

      .pa-reviews__nav:hover {
        opacity: 0.8;
      }

      .pa-reviews__nav--prev {
        left: 45px;
      }

      .pa-reviews__nav--next {
        right: 45px;
      }

      .pa-reviews__nav--hidden {
        opacity: 0;
        pointer-events: none;
      }

      .pa-reviews__chevron {
        width: 45px;
        height: 45px;
        color: #ffffff;
      }

      @media (max-width: 768px) {
        .pa-reviews {
          padding: 0 24px 60px;
        }

        .pa-reviews__nav {
          width: 60px;
          height: 60px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Review slide template -->
    <template id="pa-review-slide">
      <div class="swiper-slide pa-reviews__slide">
        <div class="pa-reviews__card">
          <div class="pa-reviews__thumb">
            <video
              class="pa-reviews__video"
              preload="metadata"
              muted
              playsinline
            >
              <source src="" type="video/mp4" />
            </video>
            <a
              class="pa-reviews__play"
              data-fancybox="reviews"
              data-type="html5video"
              href=""
            >
              <svg
                class="pa-reviews__play-icon"
                width="40"
                height="47"
                viewBox="0 0 40 47"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M3 3V43.6667L36.0417 23.3333L3 3Z"
                  stroke="#575757"
                  stroke-width="6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
          <div class="pa-reviews__info">
            <div class="pa-reviews__stars"></div>
            <p class="pa-reviews__name"></p>
          </div>
          <p class="pa-reviews__text"></p>
        </div>
      </div>
    </template>

    <section class="pa-reviews" style="position: relative">
      <div class="pa-reviews__swiper swiper">
        <div class="swiper-wrapper"></div>
      </div>

      <!-- Navigation -->
      <button
        class="pa-reviews__nav pa-reviews__nav--prev pa-reviews__nav--hidden"
        aria-label="Předchozí"
      >
        <svg
          class="pa-reviews__chevron"
          width="45"
          height="45"
          viewBox="0 0 69 69"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M42 17L27 34.5L42 52"
            stroke="#ffffff"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        class="pa-reviews__nav pa-reviews__nav--next pa-reviews__nav--hidden"
        aria-label="Další"
      >
        <svg
          class="pa-reviews__chevron"
          width="45"
          height="45"
          viewBox="0 0 69 69"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M27 17L42 34.5L27 52"
            stroke="#ffffff"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@6.1/dist/fancybox/fancybox.umd.js"></script>

            video: "assets/saunujeme-video-hero.mp4",

            video: "assets/saunujeme-video-hero.mp4",
            stars: 5,
          },
          {
            author: "Roman Vitvar",
            text: "Saunu máme něco přes měsíc a zatím jsme v ní každý druhý, občas i každý den. Jsme nadšeni. Podobně, jako když nám firma po 1 denní realizaci u nás toto nádherné truhlářské dílo předala. Od prvního našeho kontaktu s firmou byla dobrá spolupráce s každým z nich, s kým jsme přišli do styku (s pp Adamem a Dobiášem nejvíce).",
            video: "assets/saunujeme-video-hero.mp4",

            video: "assets/saunujeme-video-hero.mp4",
            stars: 5,
          },
          {
            author: "Roman Vitvar",
            text: "Saunu máme něco přes měsíc a zatím jsme v ní každý druhý, občas i každý den. Jsme nadšeni. Podobně, jako když nám firma po 1 denní realizaci u nás toto nádherné truhlářské dílo předala. Od prvního našeho kontaktu s firmou byla dobrá spolupráce s každým z nich, s kým jsme přišli do styku (s pp Adamem a Dobiášem nejvíce).",
            video: "assets/saunujeme-video-hero.mp4",
            stars: 5,
          },
        ];

        const template = document.getElementById("pa-review-slide");
        const wrapper = document.querySelector(
          ".pa-reviews__swiper .swiper-wrapper",
        );
        const starSvg =
          '<svg class="pa-reviews__star" viewBox="0 0 20 19" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9.993 15.748L3.821 18.993L5 12.12L0 7.253L6.9 6.253L9.986 0L13.072 6.253L19.972 7.253L14.972 12.12L16.151 18.993L9.993 15.748Z" fill="#BF9B70"/></svg>';

        const fragment = document.createDocumentFragment();

        reviews.forEach((r) => {
          const clone = template.content.cloneNode(true);

          // Video
          const video = clone.querySelector(".pa-reviews__video source");
          video.src = r.video;

          // Play link
          const playLink = clone.querySelector(".pa-reviews__play");
          playLink.href = r.video;

          // Stars
          const starsContainer = clone.querySelector(".pa-reviews__stars");
          let starsHtml = "";
          for (let i = 0; i < r.stars; i++) {
            starsHtml += starSvg;
          }
          starsContainer.innerHTML = starsHtml;

          // Text content
          clone.querySelector(".pa-reviews__name").textContent = r.author;
          clone.querySelector(".pa-reviews__text").textContent = r.text;

          fragment.appendChild(clone);
        });

        wrapper.appendChild(fragment);

        const slides = container.querySelectorAll(".pa-reviews__slide");

        const updateNav = (swiper) => {
          const showPrev = !swiper.isBeginning;
          const showNext = !swiper.isEnd;

          prevBtn.classList.toggle("pa-reviews__nav--hidden", !showPrev);
          nextBtn.classList.toggle("pa-reviews__nav--hidden", !showNext);
        };

        const updateOpacity = (swiper) => {
          const visible = container.querySelectorAll(".swiper-slide-visible");
          visible.forEach((slide) => {
            slide.classList.remove("pa-reviews__slide--faded");
          });
          if (visible.length > 0) {
            if (!swiper.isBeginning) {
              visible[0].classList.add("pa-reviews__slide--faded");
            }
            if (!swiper.isEnd) {
              visible[visible.length - 1].classList.add(
                "pa-reviews__slide--faded",
              );
            }
          }
        };

        if (slides.length > 5) {
          const swiper = new Swiper(".pa-reviews__swiper", {
            slidesPerView: 5,
            spaceBetween: 24,
            slidesPerGroup: 1,
            watchOverflow: true,
            watchSlidesProgress: true,
            breakpoints: {
              0: { slidesPerView: 1.2, spaceBetween: 12 },
              480: { slidesPerView: 2, spaceBetween: 16 },
              768: { slidesPerView: 3, spaceBetween: 20 },
              1024: { slidesPerView: 4, spaceBetween: 24 },
              1280: { slidesPerView: 5, spaceBetween: 24 },
            },
            navigation: {
              nextEl: ".pa-reviews__nav--next",
              prevEl: ".pa-reviews__nav--prev",
            },
            on: {
              init: function () {
                updateNav(this);
                updateOpacity(this);
              },
              slideChange: function () {
                updateNav(this);
                updateOpacity(this);
              },
            },
          });

          let resizeTimer;
          window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
              swiper.update();
              updateOpacity(swiper);
            }, 200);
          });
        } else {
          slides[slides.length - 1].classList.add("pa-reviews__slide--faded");
        }

        // Initialize Fancybox
        try {
          Fancybox.bind("[data-fancybox]", {
            Carousel: {
              Video: {
                autoplay: true,
              },
            },
          });
        } catch (e) {
          // Fancybox init failed
        }
      })();
    </script>
  </body>
</html>
