<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modely — Dev Preview</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      .pa-models {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr));
        gap: 10px;
      }

      .pa-models__actions {
        grid-column: 1 / -1;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        padding-top: 20px;
      }

      .pa-models__card {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 80px 40px;
        min-height: 394px;
        background-size: cover;
        background-position: center;
        position: relative;
      }

      .pa-models__card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(20, 22, 26, 0.35);
      }

      .pa-models__title {
        position: relative;
        z-index: 1;
        font-family: var(--pa-font-base);
        font-size: 27px;
        font-weight: 600;
        text-align: center;
        color: #ffffff;
        margin: 0;
        line-height: 1.2;
      }

      @media (max-width: 768px) {
        .pa-models__card {
          min-height: 280px;
          padding: 60px 24px;
        }

        .pa-models__title {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <section class="pa-models">
      <div
        class="pa-models__card"
        style="background-image: url('assets/sections/4x4/img1.jpg')"
      >

      </div>
      <div
        class="pa-models__card"
        style="background-image: url('assets/sections/4x4/img2.png')"
      >
        <h2 class="pa-models__title">Vitae Design</h2>
      </div>
      <div
        class="pa-models__card"
        style="background-image: url('assets/sections/4x4/img3.jpg')"
      >
        <h2 class="pa-models__title">Vitae Silver</h2>
      </div>
      <div

        style="background-image: url('assets/sections/4x4/img4.jpg')"

      </div>
